# Sonar project already created on sonarcloud.io for ima-jin/dykil; SONAR_TOKEN
# is an org secret — see .github/workflows/sonarcloud.yml.
sonar.organization=ima-jin
sonar.projectKey=ima-jin_dykil

sonar.sources=.
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/coverage/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Coverage is not required for: build/config files (not app logic), the
# instrumentation boot-check (a one-line env guard), React UI shells
# (layout/page/providers — presentational, no business logic), and the test
# files themselves (vitest's own coverage.exclude already omits them from
# lcov.info, so without this they'd be measured as 0% covered rather than
# skipped), the pm2 ecosystem file, and the thin CLI entry points under scripts/
# (their logic lives in scripts/lib/*.mjs, which is unit tested; the entry points
# are exercised as subprocesses by scripts/__tests__). Every route under app/api and every module under src/lib is unit
# tested and counted normally.
sonar.coverage.exclusions=**/*.config.js,**/*.config.cjs,**/*.config.mjs,**/*.config.ts,**/__tests__/**,**/*.test.ts,instrumentation.ts,app/layout.tsx,app/page.tsx,app/claim/page.tsx,app/providers.tsx,app/globals.css,ecosystem.config.cjs,scripts/check-env.mjs,scripts/legacy-baseline.mjs
